# Staging verification against a real Supabase Postgres project.
#
# ci.yml stays on ephemeral Docker Postgres for every push/PR: fast, isolated,
# free, and safe to run concurrently. This workflow is the opposite tradeoff —
# one shared, persistent Supabase database — so it only runs when someone asks
# for it, never automatically on every push.
#
# Requires a repo secret `SUPABASE_DATABASE_URL` (Settings > Secrets and
# variables > Actions), the Postgres connection string from the Supabase
# project's Settings > Database > Connection string > URI.
name: Supabase staging

on:
  workflow_dispatch: {}
  schedule:
    # Weekly canary so drift against the real database is caught even if
    # nobody triggers this by hand.
    - cron: "0 6 * * 1"

concurrency:
  # Only one run at a time: all runs share the same Supabase database.
  group: supabase-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Migrate, seed, and test against Supabase
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      E2E_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fail fast if the secret is missing
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::SUPABASE_DATABASE_URL is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm run db:generate

      # Same migration path a real deploy takes.
      - run: npm run db:deploy

      - run: npm run test

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-supabase
          path: playwright-report/
          retention-days: 7
